<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>CTI Platform v2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; }
    body { background: #080c14; color: #f1f5f9; font-family: 'DM Sans', sans-serif; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #111827; }
    ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
    @keyframes spin        { to { transform: rotate(360deg); } }
    @keyframes pulse-dot   { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(1.5)} }
    @keyframes slide-in    { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    @keyframes fade-in     { from{opacity:0} to{opacity:1} }
    @keyframes progress-bar { from{width:0} to{width:100%} }
    @keyframes shimmer { 0%{background-position:-400px 0} 100%{background-position:400px 0} }
    @keyframes kev-pulse { 0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.5)} 50%{box-shadow:0 0 0 4px rgba(220,38,38,0)} }
    @keyframes badge-pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.7;transform:scale(1.08)} }
    @keyframes expand-in { from{opacity:0;max-height:0} to{opacity:1;max-height:2000px} }
    .spin       { animation: spin .85s linear infinite; }
    .pulse      { animation: badge-pulse 2.8s ease infinite; }
    .slide-in   { animation: slide-in .2s ease forwards; }
    .fade-in    { animation: fade-in .18s ease forwards; }
    .kev-pulse  { animation: kev-pulse 2s ease infinite; }
    .shimmer    { background: linear-gradient(90deg,#1a2235 25%,#243050 50%,#1a2235 75%); background-size:400px 100%; animation: shimmer 1.4s infinite; }
    .expand-in  { animation: expand-in .22s ease forwards; overflow: hidden; }
    input, textarea, select, button { outline: none; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
