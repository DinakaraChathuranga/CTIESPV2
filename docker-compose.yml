
services:
  # ── PostgreSQL + pgvector ─────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cti_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cti}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ctipassword}
      POSTGRES_DB: ${POSTGRES_DB:-ctidb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cti}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis (Celery broker + cache) ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: cti_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── FastAPI Backend ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cti_backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cti}:${POSTGRES_PASSWORD:-ctipassword}@postgres:5432/${POSTGRES_DB:-ctidb}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
      - report_pdfs:/app/generated_reports
      - sample_reports:/app/sample_reports
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  # ── Celery Worker (background jobs) ──────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cti_worker
    env_file: .env
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cti}:${POSTGRES_PASSWORD:-ctipassword}@postgres:5432/${POSTGRES_DB:-ctidb}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
      - report_pdfs:/app/generated_reports
      - sample_reports:/app/sample_reports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A workers.celery_app worker --loglevel=info --concurrency=2 -Q cti_feeds,reports,default

  # ── Celery Beat (scheduler) ───────────────────────────────────────────────
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cti_beat
    env_file: .env
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cti}:${POSTGRES_PASSWORD:-ctipassword}@postgres:5432/${POSTGRES_DB:-ctidb}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      - redis
    command: celery -A workers.celery_app beat --loglevel=info

  # ── React Frontend ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cti_frontend
    ports:
      - "443:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  report_pdfs:
  sample_reports:
